{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orchestr8.fullname" . }}-auth
  namespace: {{ .Release.Namespace }}
  labels: {{- include "orchestr8.labels" . | nindent 4 }}
  annotations:
    # Survives an uninstall so a reinstall does not invalidate every session
    # and every ingest token in the same moment.
    helm.sh/resource-policy: keep
type: Opaque
data:
  AUTH_SECRET: {{ include "orchestr8.keepSecret" (dict "ns" .Release.Namespace "name" (printf "%s-auth" (include "orchestr8.fullname" .)) "key" "AUTH_SECRET" "default" (default (randAlphaNum 48) .Values.auth.secret)) }}
  AUTH_GOOGLE_ID: {{ .Values.auth.google.clientId | b64enc | quote }}
  AUTH_GOOGLE_SECRET: {{ .Values.auth.google.clientSecret | b64enc | quote }}
  AUTH_GITHUB_ID: {{ .Values.auth.github.clientId | b64enc | quote }}
  AUTH_GITHUB_SECRET: {{ .Values.auth.github.clientSecret | b64enc | quote }}
  # Claims the deployment. A fresh install is reachable before its owner has
  # signed in, so without this the window between `helm install` and that first
  # login is a window in which a stranger becomes the owner. Read it out of the
  # cluster; it is never shown on the page that asks for it.
  ORCHESTR8_BOOTSTRAP_TOKEN: {{ include "orchestr8.keepSecret" (dict "ns" .Release.Namespace "name" (printf "%s-auth" (include "orchestr8.fullname" .)) "key" "ORCHESTR8_BOOTSTRAP_TOKEN" "default" (default (randAlphaNum 32) .Values.auth.bootstrapToken)) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orchestr8.fullname" . }}-ingest
  namespace: {{ .Release.Namespace }}
  labels: {{- include "orchestr8.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  # Shared by the ingest gateway and the collector, and by nothing else. This
  # is what makes the gateway the only way telemetry can be written: the
  # collector refuses a batch that does not carry it, so reaching the
  # collector's port is not enough.
  ingest.secret: {{ include "orchestr8.keepSecret" (dict "ns" .Release.Namespace "name" (printf "%s-ingest" (include "orchestr8.fullname" .)) "key" "ingest.secret" "default" (randAlphaNum 64)) }}
{{- if not .Values.postgres.external.dsn }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orchestr8.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels: {{- include "orchestr8.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  POSTGRES_PASSWORD: {{ include "orchestr8.keepSecret" (dict "ns" .Release.Namespace "name" (printf "%s-postgres" (include "orchestr8.fullname" .)) "key" "POSTGRES_PASSWORD" "default" (default (randAlphaNum 32) .Values.postgres.password)) }}
{{- end }}
{{- if not .Values.clickhouse.external.url }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orchestr8.fullname" . }}-clickhouse
  namespace: {{ .Release.Namespace }}
  labels: {{- include "orchestr8.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  CLICKHOUSE_PASSWORD: {{ include "orchestr8.keepSecret" (dict "ns" .Release.Namespace "name" (printf "%s-clickhouse" (include "orchestr8.fullname" .)) "key" "CLICKHOUSE_PASSWORD" "default" (default (randAlphaNum 32) .Values.clickhouse.password)) }}
{{- end }}
