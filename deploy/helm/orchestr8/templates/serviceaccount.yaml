{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "orchestr8.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "orchestr8.labels" . | nindent 4 }}
# No RBAC rules: nothing in this chart reads the Kubernetes API. The agent that
# does needs them, and it runs in the customer's cluster, not this one.
automountServiceAccountToken: false
{{- end }}
