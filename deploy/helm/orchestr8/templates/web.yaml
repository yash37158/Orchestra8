apiVersion: v1
kind: Service
metadata:
  name: {{ include "orchestr8.fullname" . }}-web
  namespace: {{ .Release.Namespace }}
  labels: {{- include "orchestr8.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports: [{ port: 3000, targetPort: http, name: http }]
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orchestr8.fullname" . }}-web
  namespace: {{ .Release.Namespace }}
  labels: {{- include "orchestr8.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "orchestr8.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        checksum/auth: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "orchestr8.serviceAccountName" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: {{ include "orchestr8.image" (dict "root" . "repo" .Values.web.image "tag" .Values.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports: [{ containerPort: 3000, name: http }]
          env:
            - name: ORCHESTR8_API_URL
              value: "http://{{ include "orchestr8.fullname" . }}-api:8088"
            {{- if not .Values.postgres.external.dsn }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "orchestr8.fullname" . }}-postgres, key: POSTGRES_PASSWORD }
            {{- end }}
            # Auth.js writes sessions here; the API reads them back from the
            # same rows. One control plane, two readers.
            - name: ORCHESTR8_CONTROL_DSN
              value: {{ include "orchestr8.postgresDsn" . | quote }}
            {{- $public := include "orchestr8.publicUrl" . }}
            {{- if $public }}
            # OAuth callbacks come back to this address and the provider
            # compares them against what was registered, character for
            # character. It has to be the external URL, not what the pod sees.
            - name: AUTH_URL
              value: {{ $public | quote }}
            {{- else }}
            # No external address configured, so the app has to work the URL
            # out from the request. That means trusting the Host header, which
            # a proxy in front of it can set to anything — and callback URLs
            # are built from it. Fine behind a port-forward, wrong on anything
            # a stranger can reach: set web.publicUrl or ingress.host and this
            # disappears.
            - name: AUTH_TRUST_HOST
              value: "true"
            {{- end }}
            - name: NODE_ENV
              value: production
          envFrom:
            - secretRef:
                name: {{ .Values.auth.existingSecret | default (printf "%s-auth" (include "orchestr8.fullname" .)) }}
          volumeMounts:
            - { name: cache, mountPath: /app/apps/web/.next/cache }
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /signin, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /signin, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
